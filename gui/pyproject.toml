[project]
name = "holley-gui"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.28",
    "google-cloud-bigquery>=3.0",
    "db-dtypes>=1.0",
    "pandas>=2.0",
    "plotly>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "components"]

[tool.pytest.ini_options]
markers = ["integration: tests that hit real BigQuery"]
pythonpath = ["."]


[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
]
